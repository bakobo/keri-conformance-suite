[project]
name = "keri-conformance-suite"
version = "0.0.1"
description = "Conformance suite for CESR, KERI, ACDC and IPEX implementations: cases, a runner, and adapters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo LLC" }]
# The runner has no runtime dependencies on purpose: it must install anywhere an adapter author
# works, and it must never pull in an implementation under test. Generators, which do drive
# keripy, run in their own pinned environments.
dependencies = []

[project.scripts]
kcs = "keri_conformance.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keri_conformance"]

[tool.pytest.ini_options]
# The gate measures the runner and the stdlib case generators (scripts/regenerate is a one-line
# entry point to generators/spec_tables/cli.py). The keripy cross-checks under generators/keripy*
# need keripy, run by hand in their own environments, and are not imported here.
addopts = "--cov=keri_conformance --cov=generators.spec_tables --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
