name: CI

# CI tests the suite's own correctness, never an implementation's (docs/design.md, Continuous
# integration). Job `test` lints, regenerates the cases and the clause coverage report and compares
# them with the committed ones, checks the committed results and the adapter READMEs' results
# tables, and runs the runner's tests. Job `site` builds the documentation site without deploying
# it; pages.yml deploys it from main. Each adapter job builds that adapter at its pin and runs the
# adapter's own tests and `kcs check-adapter`, because the adapters are code in this repository.
# No job runs a profile against an adapter: the shipped adapters' results are committed under
# results/, refreshed and checked locally with scripts/reproduce-results, and rerun in Actions
# only on demand (reproduce.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked fails when uv.lock does not match pyproject.toml, rather than testing a stale environment.
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # The generators read the pinned CESR specification text, which is not in this repository
      # (its licence differs); they fetch it into a cache and verify its SHA-256. CI requires it,
      # so a test that needs the text fails here instead of skipping. None of these steps needs
      # keripy: the generators use only the standard library, and the keripy cross-checks under
      # generators/keripy_check and generators/keripy1x_check run by hand in their own
      # environments.
      - name: Regenerate every case and compare with the committed ones
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/regenerate --check
      # The clause coverage report under docs/coverage/ is generated from the cases, the triage
      # files and the pinned specification texts; this fails when it is stale.
      - name: Regenerate the clause coverage report and compare with the committed one
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/clause-coverage --check
      # The committed results under results/ are what the Pages workflow publishes, and a submitted
      # one is untrusted input; this refuses one that would not pass that build's checks, renders
      # the results pages (generated at build time, never committed) so a result that breaks them
      # fails here, and fails when an adapter README's generated results table is stale. None of
      # it runs an adapter.
      - name: Check the committed results and assemble the site source
        run: |
          uv run python scripts/results check results
          uv run python scripts/reproduce-results readmes --check
          uv run python scripts/site-source --out "$RUNNER_TEMP/site-src"
      - name: Run tests (100% branch coverage gate)
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run pytest

  # The documentation site, built as .github/workflows/pages.yml builds it, so a broken link or a page the pinned Zensical cannot build fails the pull request rather
  # than the deployment on main.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync the runner and the site generator
        run: uv sync --locked --group site
      - name: Assemble the site source
        run: uv run python scripts/site-source
      - name: Build the site
        run: uv run zensical build --clean --strict

  keripy-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      # keripy signs and verifies through pysodium, which loads the system libsodium.
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Sync the runner
        run: uv sync --locked
      # The adapter's own lockfile pins keripy main by commit; --locked refuses a stale lock.
      - name: Build the keripy adapter at its pin
        working-directory: adapters/keripy
        run: uv sync --locked
      # The adapter's tests run against both keripy generations it supports, and its 100% branch
      # coverage is a property of the two runs combined: some paths exist only on one of them.
      - name: Adapter tests (Python 3.14, keripy main)
        working-directory: adapters/keripy
        env:
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.main
        run: uv run pytest --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Build the keripy 1.2.14 instance at its pin
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked
      - name: Adapter tests (Python 3.12, keripy 1.2.14)
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.onex
        run: uv run pytest ../tests --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Adapter coverage, both generations combined (100% branch gate)
        working-directory: adapters/keripy
        run: |
          uv run coverage combine .coverage.main .coverage.onex
          uv run coverage report -m --fail-under=100
      - name: Probe both adapter instances
        run: |
          uv run kcs check-adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy"
          uv run kcs check-adapter "$PWD/adapters/keripy/keripy-1.2.14/.venv/bin/kcs-adapter-keripy"

  # The keriox adapter (adapters/keriox): keriox's CESR layer, cesrox 0.1.8 with said 0.4.3,
  # pinned exactly in Cargo.toml and Cargo.lock. The toolchain is pinned by
  # adapters/keriox/rust-toolchain.toml and installed with the runner image's rustup, so no
  # third-party action is involved.
  keriox-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync the runner
        run: uv sync --locked
      - name: Install the pinned Rust toolchain
        working-directory: adapters/keriox
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version
      # --locked refuses a Cargo.lock that does not match Cargo.toml, so the build is the pin.
      - name: Build the keriox adapter at its pin
        working-directory: adapters/keriox
        run: cargo build --locked
      - name: Adapter tests
        working-directory: adapters/keriox
        run: cargo test --locked
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/keriox/target/debug/kcs-adapter-keriox"

  # The Affinidi adapter (adapters/affinidi/README.md). It builds the adapter against its exact
  # crates.io pins from Cargo.lock with the toolchain rust-toolchain.toml names, runs the
  # adapter's own lint and tests, and probes it. rustup is preinstalled on ubuntu-latest, so no
  # third-party action is needed for the toolchain.
  affinidi-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Sync the runner
        run: uv sync --locked
      # --locked refuses a Cargo.lock that does not match Cargo.toml's exact pins.
      - name: Build the Affinidi adapter at its pins
        working-directory: adapters/affinidi
        run: cargo build --locked
      - name: Adapter lint and tests
        working-directory: adapters/affinidi
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/affinidi/target/debug/kcs-adapter-affinidi"

  # The keri-go adapter (adapters/keri-go/README.md). It builds the adapter against
  # the exact module versions go.mod requires and go.sum locks (-mod=readonly refuses any change to
  # either), runs go vet and the adapter's tests with every statement covered, and probes it.
  keri-go-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adapters/keri-go/go.mod
          cache-dependency-path: adapters/keri-go/go.sum
      - name: Sync the runner
        run: uv sync --locked
      - name: Build the keri-go adapter at its pin
        working-directory: adapters/keri-go
        run: |
          go mod verify
          go build -mod=readonly -o kcs-adapter-keri-go .
      - name: Adapter vet and tests
        working-directory: adapters/keri-go
        run: |
          test -z "$(gofmt -l .)"
          go vet -mod=readonly ./...
          go test -mod=readonly -coverprofile="$RUNNER_TEMP/keri-go.cov" ./...
          go tool cover -func="$RUNNER_TEMP/keri-go.cov" | tail -1 | grep -q '100.0%'
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/keri-go/kcs-adapter-keri-go"

  # The devrandom adapter (adapters/devrandom/README.md). It builds the adapter against its exact
  # crates.io pins from Cargo.lock with the toolchain rust-toolchain.toml names, runs the
  # adapter's own lint and tests, and probes it. rustup is preinstalled on ubuntu-latest, so no
  # third-party action is needed for the toolchain.
  devrandom-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        working-directory: adapters/devrandom
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy --component rustfmt
      - name: Sync the runner
        run: uv sync --locked
      # --locked refuses a Cargo.lock that does not match Cargo.toml's exact pins.
      - name: Build the devrandom adapter at its pins
        working-directory: adapters/devrandom
        run: cargo build --locked
      - name: Adapter lint and tests
        working-directory: adapters/devrandom
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/devrandom/target/debug/kcs-adapter-devrandom"

  # The signify-ts adapter (adapters/signify-ts/README.md). It installs signify-ts from the git
  # commit package-lock.json pins (npm ci refuses a lock that does not match package.json),
  # typechecks the adapter and runs its tests with the 100% branch gate, and probes it. Node 24
  # runs the TypeScript sources directly.
  signify-ts-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: adapters/signify-ts/.node-version
      - name: Sync the runner
        run: uv sync --locked
      - name: Install the signify-ts adapter at its pin
        working-directory: adapters/signify-ts
        run: npm ci --no-audit --no-fund
      - name: Adapter typecheck and tests (100% branch gate)
        working-directory: adapters/signify-ts
        run: |
          npm run typecheck
          npm run coverage
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/signify-ts/bin/kcs-adapter-signify-ts"

  # The cesrixir adapter (adapters/cesrixir/README.md). It runs in the official elixir image pinned
  # by digest: bin/build fetches the hex packages mix.lock pins, compiles with warnings as errors,
  # runs the adapter's tests with the 100% line gate inside the image, and builds the adapter image,
  # which the probe then runs through its launcher with no network.
  cesrixir-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync the runner
        run: uv sync --locked
      - name: Build and test the adapter image at its pins
        run: adapters/cesrixir/bin/build --progress plain
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/cesrixir/bin/kcs-adapter-cesrixir"
