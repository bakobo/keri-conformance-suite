name: CI

# This is level 1 of the three CI levels in docs/design.md (runner tests and lint). Level 2
# (adapters against pinned implementations, compared with committed baselines) and level 3
# (nightly runs against development heads) are not built yet; they arrive with the first adapters.
# Their absence here is the plan, not an omission.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked fails when uv.lock does not match pyproject.toml, rather than testing a stale environment.
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # The generators read the pinned CESR specification text, which is not in this repository
      # (its licence differs); they fetch it into a cache and verify its SHA-256. CI requires it,
      # so a test that needs the text fails here instead of skipping. Neither step needs keripy:
      # the generators use only the standard library, and the keripy cross-checks under
      # generators/keripy_check and generators/keripy1x_check run by hand in their own
      # environments.
      - name: Regenerate every case and compare with the committed ones
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/regenerate --check
      - name: Run tests (100% branch coverage gate)
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run pytest
