name: CI

# Two of the three CI levels in docs/design.md. Job `test` is level 1 (runner tests and lint).
# Job `keripy-adapter` is level 2 for the keripy adapter. It builds both instances at their pins
# (Python 3.14 with keripy main; Python 3.12 with keripy 1.2.14), runs the adapter's tests in each
# and gates their combined branch coverage at 100%, then compares five runs with the baselines
# committed beside the adapter: cesr-1.0, keri-1.0, keri-escrow and acdc-1.0 on keripy main, and
# keripy-1x-interop on keripy 1.2.14, each with its baseline-<profile>.json. Level 3 (nightly runs
# against development heads) is not built yet; its absence here is the plan, not an omission.
# Job `keriox-adapter` is level 2 for the keriox adapter; its comment says what it compares.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked fails when uv.lock does not match pyproject.toml, rather than testing a stale environment.
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # The generators read the pinned CESR specification text, which is not in this repository
      # (its licence differs); they fetch it into a cache and verify its SHA-256. CI requires it,
      # so a test that needs the text fails here instead of skipping. None of these steps needs
      # keripy: the generators use only the standard library, and the keripy cross-checks under
      # generators/keripy_check and generators/keripy1x_check run by hand in their own
      # environments.
      - name: Regenerate every case and compare with the committed ones
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/regenerate --check
      # The clause coverage report under docs/coverage/ is generated from the cases, the triage
      # files and the pinned specification texts; this fails when it is stale.
      - name: Regenerate the clause coverage report and compare with the committed one
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/clause-coverage --check
      - name: Run tests (100% branch coverage gate)
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run pytest

  keripy-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      # keripy signs and verifies through pysodium, which loads the system libsodium.
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Sync the runner
        run: uv sync --locked
      # The adapter's own lockfile pins keripy main by commit; --locked refuses a stale lock.
      - name: Build the keripy adapter at its pin
        working-directory: adapters/keripy
        run: uv sync --locked
      # The adapter's tests run against both keripy generations it supports, and its 100% branch
      # coverage is a property of the two runs combined: some paths exist only on one of them.
      - name: Adapter tests (Python 3.14, keripy main)
        working-directory: adapters/keripy
        env:
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.main
        run: uv run pytest --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Build the keripy 1.2.14 instance at its pin
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked
      - name: Adapter tests (Python 3.12, keripy 1.2.14)
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.onex
        run: uv run pytest ../tests --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Adapter coverage, both generations combined (100% branch gate)
        working-directory: adapters/keripy
        run: |
          uv run coverage combine .coverage.main .coverage.onex
          uv run coverage report -m --fail-under=100
      - name: Probe both adapter instances
        run: |
          uv run kcs check-adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy"
          uv run kcs check-adapter "$PWD/adapters/keripy/keripy-1.2.14/.venv/bin/kcs-adapter-keripy"
      # The verdict alone is not the gate here; the baseline is, and it records the verdict too.
      # A run that regresses any assertion or the verdict fails, and so does one that improves,
      # until the baseline is updated in the same change.
      - name: Run cesr-1.0 on keripy main and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy" \
            --profile cesr-1.0 --report "$RUNNER_TEMP/keripy-main-cesr-1.0.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-cesr-1.0.json "$RUNNER_TEMP/keripy-main-cesr-1.0.json"
      - name: Run keripy-1x-interop on keripy 1.2.14 and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/keripy-1.2.14/.venv/bin/kcs-adapter-keripy" \
            --profile keripy-1x-interop --report "$RUNNER_TEMP/keripy-1214-interop.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/keripy-1.2.14/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-keripy-1x-interop.json "$RUNNER_TEMP/keripy-1214-interop.json"
      - name: Run keri-1.0 on keripy main and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy" \
            --profile keri-1.0 --report "$RUNNER_TEMP/keripy-main-keri-1.0.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-keri-1.0.json "$RUNNER_TEMP/keripy-main-keri-1.0.json"
      - name: Run keri-escrow on keripy main and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy" \
            --profile keri-escrow --report "$RUNNER_TEMP/keripy-main-keri-escrow.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-keri-escrow.json "$RUNNER_TEMP/keripy-main-keri-escrow.json"
      - name: Run acdc-1.0 on keripy main and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy" \
            --profile acdc-1.0 --report "$RUNNER_TEMP/keripy-main-acdc-1.0.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-acdc-1.0.json "$RUNNER_TEMP/keripy-main-acdc-1.0.json"

  # CI level 2 for the keriox adapter (adapters/keriox): keriox's CESR layer, cesrox 0.1.8 with
  # said 0.4.3, pinned exactly in Cargo.toml and Cargo.lock. The toolchain is pinned by
  # adapters/keriox/rust-toolchain.toml and installed with the runner image's rustup, so no
  # third-party action is involved. The baselines are compared with the keripy adapter's
  # standard-library comparison tool, under the same rules as the keripy-adapter job.
  keriox-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync the runner
        run: uv sync --locked
      - name: Install the pinned Rust toolchain
        working-directory: adapters/keriox
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version
      # --locked refuses a Cargo.lock that does not match Cargo.toml, so the build is the pin.
      - name: Build the keriox adapter at its pin
        working-directory: adapters/keriox
        run: cargo build --locked
      - name: Adapter tests
        working-directory: adapters/keriox
        run: cargo test --locked
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/keriox/target/debug/kcs-adapter-keriox"
      # cesrox 0.1.8 reads only the genus 1.00 count codes, so every cesr-1.0 case is
      # not-supported and the verdict is no-evidence; the baseline records that, and a change in
      # either direction fails here until the baseline is updated in the same change.
      - name: Run cesr-1.0 and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keriox/target/debug/kcs-adapter-keriox" \
            --profile cesr-1.0 --report "$RUNNER_TEMP/keriox-cesr-1.0.json"
          echo "kcs run exited $?"
          set -e
          PYTHONPATH=adapters/keripy/src uv run python -m kcs_adapter_keripy.baseline compare \
            adapters/keriox/baseline-cesr-1.0.json "$RUNNER_TEMP/keriox-cesr-1.0.json"
      - name: Run keripy-1x-interop and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keriox/target/debug/kcs-adapter-keriox" \
            --profile keripy-1x-interop --report "$RUNNER_TEMP/keriox-interop.json"
          echo "kcs run exited $?"
          set -e
          PYTHONPATH=adapters/keripy/src uv run python -m kcs_adapter_keripy.baseline compare \
            adapters/keriox/baseline-keripy-1x-interop.json "$RUNNER_TEMP/keriox-interop.json"

  # Level 2 for the Affinidi adapter (adapters/affinidi/README.md). It builds the adapter against
  # its exact crates.io pins from Cargo.lock with the toolchain rust-toolchain.toml names, runs
  # the adapter's own lint and tests, probes it, and compares a cesr-1.0 run and a
  # keripy-1x-interop run with their committed baselines using the keripy adapter's baseline
  # tool (standard library only, so it runs from source without keripy installed). rustup is preinstalled on ubuntu-latest, so no
  # third-party action is needed for the toolchain.
  affinidi-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Sync the runner
        run: uv sync --locked
      # --locked refuses a Cargo.lock that does not match Cargo.toml's exact pins.
      - name: Build the Affinidi adapter at its pins
        working-directory: adapters/affinidi
        run: cargo build --locked
      - name: Adapter lint and tests
        working-directory: adapters/affinidi
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Probe the adapter
        run: uv run kcs check-adapter "$PWD/adapters/affinidi/target/debug/kcs-adapter-affinidi"
      # As for keripy: the baseline is the gate, and it records the verdict too. A regression fails,
      # and so does an improvement until the baseline is updated in the same change.
      - name: Run cesr-1.0 on Affinidi and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/affinidi/target/debug/kcs-adapter-affinidi" \
            --profile cesr-1.0 --report "$RUNNER_TEMP/affinidi-cesr-1.0.json"
          echo "kcs run exited $?"
          set -e
          PYTHONPATH=adapters/keripy/src uv run python -m kcs_adapter_keripy.baseline compare \
            adapters/affinidi/baseline-cesr-1.0.json "$RUNNER_TEMP/affinidi-cesr-1.0.json"
      - name: Run keripy-1x-interop on Affinidi and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/affinidi/target/debug/kcs-adapter-affinidi" \
            --profile keripy-1x-interop --report "$RUNNER_TEMP/affinidi-interop.json"
          echo "kcs run exited $?"
          set -e
          PYTHONPATH=adapters/keripy/src uv run python -m kcs_adapter_keripy.baseline compare \
            adapters/affinidi/baseline-keripy-1x-interop.json "$RUNNER_TEMP/affinidi-interop.json"
