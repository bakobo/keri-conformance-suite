name: CI

# This is level 1 of the three CI levels in docs/design.md (runner tests and lint). Level 2
# (adapters against pinned implementations, compared with committed baselines) and level 3
# (nightly runs against development heads) are not built yet; they arrive with the first adapters.
# Their absence here is the plan, not an omission.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked fails when uv.lock does not match pyproject.toml, rather than testing a stale environment.
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
