name: CI

# This is level 1 of the three CI levels in docs/design.md (runner tests and lint). Level 2
# (adapters against pinned implementations, compared with committed baselines) and level 3
# (nightly runs against development heads) are not built yet; they arrive with the first adapters.
# Their absence here is the plan, not an omission.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      # --frozen fails rather than silently updating uv.lock.
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
