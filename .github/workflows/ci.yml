name: CI

# Two of the three CI levels in docs/design.md. Job `test` is level 1 (runner tests and lint).
# Job `keripy-adapter` is level 2 for the keripy adapter: it builds the adapter against its pinned
# keripy and compares a cesr-1.0 run with the baseline committed beside it. Level 3 (nightly runs
# against development heads) is not built yet; its absence here is the plan, not an omission.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked fails when uv.lock does not match pyproject.toml, rather than testing a stale environment.
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # The generators read the pinned CESR specification text, which is not in this repository
      # (its licence differs); they fetch it into a cache and verify its SHA-256. CI requires it,
      # so a test that needs the text fails here instead of skipping. Neither step needs keripy:
      # the generators use only the standard library, and the keripy cross-checks under
      # generators/keripy_check and generators/keripy1x_check run by hand in their own
      # environments.
      - name: Regenerate every case and compare with the committed ones
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run python scripts/regenerate --check
      - name: Run tests (100% branch coverage gate)
        env:
          KCS_REQUIRE_SPEC: "1"
        run: uv run pytest

  keripy-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      # keripy signs and verifies through pysodium, which loads the system libsodium.
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Sync the runner
        run: uv sync --locked
      # The adapter's own lockfile pins keripy main by commit; --locked refuses a stale lock.
      - name: Build the keripy adapter at its pin
        working-directory: adapters/keripy
        run: uv sync --locked
      # The adapter's tests run against both keripy generations it supports, and its 100% branch
      # coverage is a property of the two runs combined: some paths exist only on one of them.
      - name: Adapter tests (Python 3.14, keripy main)
        working-directory: adapters/keripy
        env:
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.main
        run: uv run pytest --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Build the keripy 1.2.14 instance at its pin
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked
      - name: Adapter tests (Python 3.12, keripy 1.2.14)
        working-directory: adapters/keripy/keripy-1.2.14
        env:
          UV_PYTHON: "3.12"
          COVERAGE_FILE: ${{ github.workspace }}/adapters/keripy/.coverage.onex
        run: uv run pytest ../tests --cov=kcs_adapter_keripy --cov-branch --cov-report=
      - name: Adapter coverage, both generations combined (100% branch gate)
        working-directory: adapters/keripy
        run: |
          uv run coverage combine .coverage.main .coverage.onex
          uv run coverage report -m --fail-under=100
      - name: Probe both adapter instances
        run: |
          uv run kcs check-adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy"
          uv run kcs check-adapter "$PWD/adapters/keripy/keripy-1.2.14/.venv/bin/kcs-adapter-keripy"
      # The verdict alone is not the gate here; the baseline is, and it records the verdict too.
      # A run that regresses any assertion or the verdict fails, and so does one that improves,
      # until the baseline is updated in the same change.
      - name: Run cesr-1.0 on keripy main and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/.venv/bin/kcs-adapter-keripy" \
            --profile cesr-1.0 --report "$RUNNER_TEMP/keripy-main-cesr-1.0.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-cesr-1.0.json "$RUNNER_TEMP/keripy-main-cesr-1.0.json"
      - name: Run keripy-1x-interop on keripy 1.2.14 and compare with its baseline
        run: |
          set +e
          uv run kcs run --adapter "$PWD/adapters/keripy/keripy-1.2.14/.venv/bin/kcs-adapter-keripy" \
            --profile keripy-1x-interop --report "$RUNNER_TEMP/keripy-1214-interop.json"
          echo "kcs run exited $?"
          set -e
          adapters/keripy/keripy-1.2.14/.venv/bin/python -m kcs_adapter_keripy.baseline compare \
            adapters/keripy/baseline-keripy-1x-interop.json "$RUNNER_TEMP/keripy-1214-interop.json"
