name: Pages

# Builds the documentation site and deploys it to GitHub Pages (docs/publishing-results.md). It
# renders only what is committed: the README, docs/, the profiles, and the results under results/,
# which the shipped adapters' maintainer-run results and submitted results both live in. It builds
# no adapter and runs no case; the results it publishes were produced and committed before the push
# (scripts/reproduce-results), so a push of markdown or result JSON republishes the site without
# re-analysing anything. The build job holds only a read-only token; the deploy job, which holds
# the Pages and OIDC permissions, runs no repository code at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time, and a deployment in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The site group is the pinned generator; the runner itself has no runtime dependencies.
      - name: Sync the runner and the site generator
        run: uv sync --locked --group site
      - name: Assemble the site source
        run: uv run python scripts/site-source
      - name: Build the site
        run: uv run zensical build --clean --strict
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails here, before deploying, if Pages is not enabled with GitHub Actions as its source.
      - name: Check the Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
