version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/adapters/keriox"
    schedule:
      interval: "weekly"
    # The adapter deliberately pins the cesrox and said versions keri-core 0.17.13 ships
    # (adapters/keriox/README.md); moving either is a change to what is being tested, made by
    # hand with a re-recorded baseline, not a routine bump.
    ignore:
      - dependency-name: "cesrox"
      - dependency-name: "said"
  - package-ecosystem: "cargo"
    directory: "/adapters/affinidi"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/adapters/devrandom"
    schedule:
      interval: "weekly"
    # The adapter pins the five crates devrandom-labs published together at tag keri-rs-v0.1.0
    # (adapters/devrandom/README.md); moving them is a change to what is being tested, made by
    # hand with every pin and the reported tag and commit together, not a routine bump.
    ignore:
      - dependency-name: "keri-rs"
      - dependency-name: "keri-codec"
      - dependency-name: "keri-events"
      - dependency-name: "cesr-rs"
      - dependency-name: "cesr-stream"
