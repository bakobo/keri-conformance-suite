# The documentation site, built by Zensical (pinned exactly in pyproject.toml's site group, because
# it is pre-1.0). Its input is plain markdown assembled by scripts/site-source into _site/src: the
# README as the home page, docs/ beside it, and the results pages generated from results/. Replacing
# the generator means replacing this file and one build step. See docs/publishing-results.md.
#
#   uv sync --locked --group site
#   uv run python scripts/site-source
#   uv run zensical build --clean --strict
#
# The site is then in _site/html.

[project]
site_name = "KERI conformance suite"
site_description = "Conformance cases, a runner and published results for CESR, KERI, ACDC and IPEX implementations."
site_url = "https://bakobo.github.io/keri-conformance-suite/"
repo_url = "https://github.com/bakobo/keri-conformance-suite"
repo_name = "bakobo/keri-conformance-suite"
docs_dir = "_site/src"
# Colours taken from keri.one; the stylesheet says which.
extra_css = ["stylesheets/kcs.css"]
# Opens every link that leaves the site in one reused window named "spec".
extra_javascript = ["javascripts/external-links.js"]
site_dir = "_site/html"
nav = [
  { "Home" = "index.md" },
  { "Results" = [
    { "Results" = "results/index.md" },
    { "Reading a result" = "reading-a-result.md" },
    { "Verdicts" = "verdicts.md" },
    { "Profiles" = "profiles/index.md" },
    { "Publishing a result" = "publishing-results.md" },
  ] },
  { "Suite" = [
    { "Design" = "design.md" },
    { "Adapter protocol" = "adapter-protocol.md" },
    { "Clause coverage" = [
      { "Overview" = "coverage/README.md" },
      { "CESR clauses" = "coverage/cesr.md" },
      { "KERI clauses" = "coverage/keri.md" },
      { "ACDC clauses" = "coverage/acdc.md" },
    ] },
    { "Self-assessment" = "coverage/assessment-2026-10.md" },
  ] },
]

# The clause coverage reports quote specification sentences verbatim, and some of those sentences
# carry links to anchors in the specification's own document (#RFC4648 and the like) that do not
# exist here. Broken links to pages still fail the build; broken anchors are not checked.
[project.validation]
invalid_links = true
invalid_link_anchors = false

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Deliberately few extensions. The results pages escape result text for exactly these (the
# standard markdown escapes plus "|" for tables); an extension that gives meaning to another
# character, such as magiclink, emoji, caret, tilde or smartsymbols, would need tools/site_source.py
# to escape that character too.
[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
