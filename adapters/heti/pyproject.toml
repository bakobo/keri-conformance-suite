[project]
name = "kcs-adapter-heti"
version = "0.1.0"
description = "Adapter connecting heti to the KERI conformance suite runner (adapter protocol v1)."
readme = "README.md"
# heti requires Python 3.14.
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo LLC" }]
# heti, pinned by full commit. heti is private until it is published, so resolving this pin needs
# read access to bakobo/heti (README.md, "Building it").
dependencies = [
    "heti @ git+ssh://git@github.com/bakobo/heti@127d75ce9285c4761422d26add2b58aa5dad4804",
]

[project.scripts]
kcs-adapter-heti = "kcs_adapter_heti.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kcs_adapter_heti"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
