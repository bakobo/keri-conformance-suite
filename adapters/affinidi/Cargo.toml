[package]
name = "kcs-adapter-affinidi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "KERI conformance suite adapter (protocol v1) for Affinidi's CESR/KERI crates"
publish = false

# A standalone crate: never part of an enclosing workspace.
[workspace]

[[bin]]
name = "kcs-adapter-affinidi"
path = "src/main.rs"

[dependencies]
# The implementation under test, pinned exactly to published releases. Change both pins, run
# `cargo update -p <crate> --precise <version>`, and update IMPLEMENTATION in src/protocol.rs
# (tests/pins.rs checks that the two agree).
affinidi-keri-core = "=0.4.0"
affinidi-cesr = "=0.1.3"
serde_json = "1"

[profile.dev]
# Affinidi's parser is exercised with hostile input; overflow checks stay on as in debug.
debug = 0
