# REFERENCE COPY — not used by this repo.
#
# Copy to `.github/workflows/codeql.yml` (drop the `oss-` prefix and the leading path) in a public
# Bakobo repo, then set ((LANGUAGES)) below. Item 6 of `dev/standards/oss-posture.md`.
#
#   ((LANGUAGES))  one entry per CodeQL language present in the repo. Valid values:
#                  actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python,
#                  ruby, rust, swift
#
#                  python                  -> did-webs, thesmo, utina, witness, errors, status
#                  javascript-typescript   -> cesrview
#                  several                 -> fiki, which has py/js/go/rust/java ports
#
# A committed workflow rather than GitHub's default setup, deliberately: this org pins every action
# by commit SHA and keeps CI in the tree where it is diffable, and a scanner configured by a setting
# nobody can see in a diff is a scanner nobody notices breaking.
#
# Action SHAs below were resolved from the tag named in each trailing comment and verified to run on
# node24, per the GitHub Actions deprecation of node20. Re-verify when you bump them:
#
#   curl -sL https://raw.githubusercontent.com/<org>/<action>/<tag>/action.yml | grep -E '^\s*using:'

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a scanner that only runs on your commits never finds the vulnerability that
    # was disclosed after you stopped touching the file. Monday early, off the hour: GitHub drops
    # scheduled jobs under load at popular times, and :17 is not a popular time.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The whole point: without this the analysis runs and has nowhere to publish a finding.
      security-events: write
      contents: read
    strategy:
      # One language's failure should not hide another's findings.
      fail-fast: false
      matrix:
        language: [((LANGUAGES))]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          # security-and-quality over the default security-extended: these are small codebases
          # where the maintenance cost of the extra quality queries is low and the signal is real.
          # Drop to security-extended if a repo starts drowning in style findings.
          queries: security-and-quality

      # Compiled languages need a build before analysis. Autobuild handles the common cases; if it
      # fails for a repo, replace this step with that repo's real build command rather than
      # deleting it, because analysis of a half-built tree quietly finds less.
      - name: Autobuild
        uses: github/codeql-action/autobuild@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: "/language:${{ matrix.language }}"
